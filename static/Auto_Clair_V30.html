<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Clair V30</title><style>
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#17212b;margin:0}main{max-width:960px;margin:auto;padding:28px}h1{color:#137a62}.card{background:#fff;border-radius:12px;padding:22px;margin:16px 0;box-shadow:0 2px 10px #0001}button{background:#137a62;color:#fff;border:0;border-radius:7px;padding:11px 18px;font-size:15px;cursor:pointer}input{margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.field{border-left:4px solid #137a62;background:#f8fafb;padding:10px}.uncertain{border-left-color:#e59c00}.muted{color:#66737f;font-size:.9em}#status{white-space:pre-wrap}</style></head>
<body><main><h1>Auto Clair V30</h1><p>Analyse documentaire automobile</p><section class="card"><h2>Lire un devis</h2><input id="image" type="file" accept="image/*"><br><button onclick="readImage()">Analyser le document</button><p id="status" class="muted"></p></section><section class="card"><h2>Résultat</h2><div id="fields" class="grid"><span class="muted">Chargez un document pour commencer.</span></div><h3>Lignes tarifaires</h3><div id="tarifs" class="muted">—</div></section></main><script>
function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
function display(data){const f=data.fields||{};document.querySelector('#fields').innerHTML=Object.entries(f).map(([k,x])=>`<div class="field ${x.uncertain?'uncertain':''}"><strong>${escapeHtml(k.replaceAll('_',' '))}</strong><br>${x.value?escapeHtml(x.value):'<span class="muted">Non trouvé</span>'}${x.uncertain?'<br><span class="muted">À vérifier</span>':''}</div>`).join('');const t=data.tarifs||[];document.querySelector('#tarifs').innerHTML=t.length?t.map(x=>`<div>${escapeHtml(x.description)} — <strong>${escapeHtml(x.montant)}</strong> <span class="muted">à vérifier</span></div>`).join(''):'Aucune ligne tarifaire certaine.';document.querySelector('#status').textContent=(data.warnings||[]).join('\n')}
async function shrinkForOcr(file){const image=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('Image illisible.'));i.src=URL.createObjectURL(file)});const ratio=Math.min(1,1100/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(image.naturalWidth*ratio);canvas.height=Math.round(image.naturalHeight*ratio);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);return await new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(new Error('Préparation impossible.')),'image/jpeg',.82))}
async function readImage(){const file=document.querySelector('#image').files[0];if(!file){document.querySelector('#status').textContent='Choisissez une image.';return}document.querySelector('#status').textContent='Préparation de la photo…';try{const small=await shrinkForOcr(file);const form=new FormData();form.append('image',small,'devis-reduit.jpg');document.querySelector('#status').textContent='Lecture en cours…';const r=await fetch('/api/ocr',{method:'POST',body:form});const body=await r.text();let j;try{j=JSON.parse(body)}catch{throw Error('Le serveur a été interrompu. Réessayez dans une minute.')}if(!r.ok||!j.success)throw Error(j.error||'Erreur de lecture');display(j.data)}catch(e){document.querySelector('#status').textContent='Lecture OCR impossible : '+e.message}}
</script></body></html>
